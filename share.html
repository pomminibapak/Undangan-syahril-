<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Undangan - Sahril & Uum</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #2d4a3e, #8fa89b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #23372e;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 10px 20px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h2 {
      text-align: center;
      color: #2d4a3e;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #526b60;
      margin-bottom: 10px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #2d4a3e;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: inherit;
      font-size: 0.9rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #2d4a3e;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    button, a.btn {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-wa {
      background-color: #25D366;
      color: white;
    }
    .btn-wa:hover {
      background-color: #1ebc57;
    }
    .btn-copy {
      background-color: #2d4a3e;
      color: white;
    }
    .btn-copy:hover {
      background-color: #1e332b;
    }
    .btn-preview {
      background-color: #e0e0e0;
      color: #333;
    }
     
     .judul {
      text-align: center;
      font-size: 1rem;
      color: #526b60;
      margin-bottom: 5px;
    }
    #status-copy {
      font-size: 0.8rem;
      text-align: center;
      color: #2d4a3e;
      margin-top: 5px;
      font-weight: 600;
    }
    .namasah {
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: var(--glass-border);
      animation: counterRotate 18s linear infinite;
      padding-bottom:8px;
      text-align: center;
    }
.footer-image {
    width: 100%;
    margin: 0;
    padding-top: 20;
    padding-bottom: 10px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 0;
}

.footer-image img {
    width: 50%;
    height: auto;
    display: block;

    /* Geser 5% ke kanan */
    position: relative;
    left: 7%;
}
  </style>
</head>
<body>

  <div class="card">
    <p class="subtitle">The Wedding Of</p>
    <p class="namasah">Sahril & Uum</p>
    <p class="subtitle">Jum'at, 13 November 2026</p>
    <div class="form-group">
      <label for="guestName">Nama Tamu Undangan:</label>
      <input type="text" id="guestName" placeholder="Contoh: Bapak Gibran & Keluarga" oninput="updateLink()">
    </div>

    <div class="form-group">
      <label for="templateMsg">Pesan undangan:</label>
      <textarea id="templateMsg" rows="6" oninput="updateLink()"></textarea>
    </div>

    <div class="btn-group">
      <a id="btnWA" href="#" target="_blank" class="btn btn-wa">
        <i class="fa-brands fa-whatsapp fa-lg"></i> Kirim via WhatsApp
      </a>
      <button class="btn btn-copy" onclick="copyToClipboard()">
        <i class="fa-regular fa-copy"></i> Salin Teks & Link
      </button>
      <a id="btnPreview" href="#" target="_blank" class="btn btn-preview">
        <i class="fa-solid fa-eye"></i> Pratinjau Tampilan Undangan
      </a>
      <p id="status-copy"></p>
    </div>
    <footer class="footer-image">
    <img src="footer.png" alt="Bagi Undangan">
</footer>
  </div>
  
  <script>
    // MASUKKAN URL DOMAIN WEBSITE VERCEL ANDA DI SINI
    const baseUrl = "https://sahril-uum.vercel.app";

    // Template Default Pesan WhatsApp
    const defaultTemplate = 
`Kepada Yth.
*[NAMA_TAMU]*

Assalamu’alaikum Wr. Wb.

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:

*Sahril 💖 Uum*

Berikut detail acara dan link undangan digital kami:

💌[LINK_UNDANGAN]💌

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.

Terima kasih,
Wassalamu’alaikum Wr. Wb.`;

    document.getElementById('templateMsg').value = defaultTemplate;

    function generateData() {
      const name = document.getElementById('guestName').value.trim();
      const guestFormatted = name ? encodeURIComponent(name) : "Tamu+Undangan";
      
      // Link Undangan dengan parameter ?to=Nama
      const fullUrl = `${baseUrl}/?to=${guestFormatted}`;
      
      // Mengganti placeholder [NAMA_TAMU] dan [LINK_UNDANGAN]
      let message = document.getElementById('templateMsg').value;
      message = message.replace("[NAMA_TAMU]", name || "Tamu Undangan");
      message = message.replace("[LINK_UNDANGAN]", fullUrl);

      return {
        fullUrl: fullUrl,
        message: message,
        waUrl: `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`
      };
    }

    function updateLink() {
      const data = generateData();
      document.getElementById('btnWA').href = data.waUrl;
      document.getElementById('btnPreview').href = data.fullUrl;
    }

    function copyToClipboard() {
      const data = generateData();
      navigator.clipboard.writeText(data.message).then(() => {
        const status = document.getElementById('status-copy');
        status.innerText = "Teks & link berhasil disalin!";
        setTimeout(() => { status.innerText = ""; }, 3000);
      });
    }
    // Inisialisasi awal
    updateLink();
  </script>
</body>
</html>
